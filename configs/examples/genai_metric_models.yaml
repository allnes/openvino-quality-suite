# Canonical GenAI model matrix for OVIQS GPU metric verification.
#
# These five models are the ONLY supported networks. Each is published as a
# ready-made OpenVINO IR artifact (INT4) in the OpenVINO/llm collection, so the
# metric runs download the artifact directly instead of exporting from scratch.
# `id` is the upstream Hugging Face checkpoint; `openvino_artifact` is the
# pre-converted OpenVINO repository that `oviq run-gpu-suite` consumes.
model_matrix:
  target_gpu:
    default: Qwen/Qwen3-0.6B
    models:
      - id: Qwen/Qwen3-0.6B
        family: qwen3
        size: 0.6b
        minimal_weight_format: int4
        non_distilled: true
        openvino_artifact: OpenVINO/Qwen3-0.6B-int4-ov
        note: "Smallest canonical network; entry-level GPU sanity target with full logits and GenAI generation."
        metrics:
          - likelihood
          - distribution_drift
          - long_context_mechanics
          - generation
          - structured_output
          - rag
          - agent
      - id: google/gemma-2-9b-it
        family: gemma2
        size: 9b
        minimal_weight_format: int4
        non_distilled: true
        openvino_artifact: OpenVINO/gemma-2-9b-it-int4-ov
        note: "Mid-size instruction model; INT4 NNCF weights (ratio 1.0, group_size 128)."
        metrics:
          - likelihood
          - distribution_drift
          - long_context_mechanics
          - generation
          - structured_output
          - rag
          - agent
      - id: mistralai/Mistral-7B-Instruct-v0.1
        family: mistral
        size: 7b
        minimal_weight_format: int4
        non_distilled: true
        openvino_artifact: OpenVINO/mistral-7b-instruct-v0.1-int4-ov
        note: "7B instruction baseline; INT4 NNCF weights (ratio 0.8, group_size 128)."
        metrics:
          - likelihood
          - distribution_drift
          - long_context_mechanics
          - generation
          - structured_output
          - rag
          - agent
      - id: openai/gpt-oss-20b
        family: gpt_oss
        size: 20b
        minimal_weight_format: int4
        non_distilled: true
        openvino_artifact: OpenVINO/gpt-oss-20b-int4-ov
        note: "MoE with 3.6B active parameters; requires OpenVINO >= 2026.0 and Optimum Intel >= 1.27."
        metrics:
          - likelihood
          - distribution_drift
          - long_context_mechanics
          - generation
          - structured_output
          - rag
          - agent
      - id: microsoft/phi-4
        family: phi
        size: 14b
        minimal_weight_format: int4
        non_distilled: true
        openvino_artifact: OpenVINO/phi-4-int4-ov
        note: "14B reasoning model; INT4 NNCF weights (ratio 1.0, group_size 128)."
        metrics:
          - likelihood
          - distribution_drift
          - long_context_mechanics
          - generation
          - structured_output
          - rag
          - agent

export_variants:
  eval_logits:
    task: text-generation
    weight_format: int4
    backend: optimum-openvino
  genai_generation:
    task: text-generation-with-past
    weight_format: int4
    backend: openvino-genai

device_policy:
  unit_tests: cpu_or_dummy_only
  metric_verification_target_file: null
