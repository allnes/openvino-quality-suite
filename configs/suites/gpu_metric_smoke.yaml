run:
  id: gpu_metric_smoke
  suite: openvino_llm_quality_v1_gpu

architecture:
  logits_level:
    backend: openvino-runtime
    device: GPU
    metrics:
      - nll
      - perplexity
      - sliding_window_ppl
      - position_bucketed_ppl
      - self_kl
      - self_js
      - entropy_drift
      - logit_cosine
      - batch_invariance_drift
  generation_layer:
    backend: openvino-genai
    device: GPU
    metrics:
      - ngram_repetition
      - json_validity
  application_layer:
    metrics:
      - rag_evidence_coverage
      - supported_claim_ratio_placeholder
      - tool_call_validity
      - redundant_tool_call_rate
      - agent_state_drift
      - observation_grounding_placeholder

# Canonical five OpenVINO/llm artifacts. `output_dir` is the local directory the
# pre-converted INT4 OpenVINO IR is downloaded into; the same directory serves
# both the OpenVINO Runtime logits backend and the OpenVINO GenAI generation
# layer (these artifacts ship the full causal-LM IR plus a with-past variant).
models:
  qwen3_0_6b:
    hf_id: Qwen/Qwen3-0.6B
    openvino_artifact: OpenVINO/Qwen3-0.6B-int4-ov
    weight_format: int4
    output_dir: models/qwen3-0_6b-int4-ov
  gemma2_9b_it:
    hf_id: google/gemma-2-9b-it
    openvino_artifact: OpenVINO/gemma-2-9b-it-int4-ov
    weight_format: int4
    output_dir: models/gemma-2-9b-it-int4-ov
  mistral7b_instruct:
    hf_id: mistralai/Mistral-7B-Instruct-v0.1
    openvino_artifact: OpenVINO/mistral-7b-instruct-v0.1-int4-ov
    weight_format: int4
    output_dir: models/mistral-7b-instruct-v0.1-int4-ov
  gpt_oss_20b:
    hf_id: openai/gpt-oss-20b
    openvino_artifact: OpenVINO/gpt-oss-20b-int4-ov
    weight_format: int4
    output_dir: models/gpt-oss-20b-int4-ov
  phi_4:
    hf_id: microsoft/phi-4
    openvino_artifact: OpenVINO/phi-4-int4-ov
    weight_format: int4
    output_dir: models/phi-4-int4-ov

datasets:
  likelihood: data/smoke_likelihood.jsonl

outputs:
  report: reports/target-models/gpu_suite.json
